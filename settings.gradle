pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        // maven.architectury.dev throttles sustained downloads on this network to ~180 B/s,
        // so jars never finish. We front it with a tiny local chunked/caching proxy
        // (tools/ArchProxy.java on :8099) which fetches via small HTTP Range requests.
        // Start the proxy before building. Falls back to nothing else for these artifacts.
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        // architectury-loom's build classpath needs com.mojang:datafixerupper, which lives
        // on Mojang's library repo (not on Central/Forge/Fabric).
        maven { url "https://libraries.minecraft.net/" }
        gradlePluginPortal()
        // Required so the architectury-plugin / loom SNAPSHOT markers can resolve their
        // transitive deps (kotlin-stdlib-jdk8:1.3.72, tiny-remapper, ...). Without this the
        // plugin "could not be resolved" even though the markers themselves are present.
        mavenCentral()
    }
}

include("common")
include("common:mojmap")
include("fabric")
// forge & neoforge intentionally not built: we only ship the Fabric jar, and skipping them
// avoids forge-only deps (e.g. dev.architectury:mixin-patched) Loom pulls straight from the
// throttled architectury.dev, and cuts build time (one MC remap instead of three).
// include("forge")
// include("neoforge")

rootProject.name = "Figura"